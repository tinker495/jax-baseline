category: mjlab
runner: pg
# PPO settings: mjlab v1.6.0 unitree_go1_ppo_runner_cfg (shared by flat and rough).
# https://github.com/mujocolab/mjlab/blob/v1.6.0/src/mjlab/tasks/velocity/config/go1/rl_cfg.py
runtime:
  device: 0
base:
  env: Mjlab-Velocity-Rough-Unitree-Go1
  env_backend: mjlab
  env_device: cuda:0
  env_jax_arrays: true
  env_reuse_for_eval: true
  worker: 4096
  # 4096 workers * 24 steps * 10000 upstream iterations.
  steps: 983040000
  eval_num: 5
  batch: 24
  actor_model: ../models/mlp_512_256_128_elu.json
  critic_model: ../models/mlp_512_256_128_elu.json
  mini_batch: 24576
  epoch_num: 5
  learning_rate: 0.001
  desired_kl: 0.01
  gamma: 0.99
  lamda: 0.95
  ppo_eps: 0.2
  value_clip: 0.2
  ent_coef: 0.01
  obs_rms_norm: true
  gae_normalize: true
  gae_normalize_scope: batch
  max_grad_norm: 1.0
  optimizer: adam
  optimizer_eps: 1.0e-8
  seed: 0
variants:
  - {algo: PPO, enabled: true}
