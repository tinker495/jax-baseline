category: mjlab
runner: dpg
# FlashSAC's IsaacLab recipe, applied to the MJLab Go1 task.
# https://github.com/Holiday-Robot/FlashSAC/blob/87edc9061150ae9e962dd84e6544e27a1554b3ab/scripts/run_isaaclab.sh
runtime:
  device: 0
base:
  env: Mjlab-Velocity-Flat-Unitree-Go1
  env_backend: mjlab
  env_device: cuda:0
  env_jax_arrays: true
  env_reuse_for_eval: true
  model_lib: flax
  worker: 1024
  # train_freq counts transitions across all workers: two updates per vector step.
  train_freq: 1024
  gradient_steps: 2
  steps: 50000896
  eval_num: 10
  learning_rate: 0.0003
  learning_rate_end: 0.00015
  optimizer: adam
  memory_backend: gpu
  buffer_size: 1e7
  batch: 2048
  learning_starts: 100000
  gamma: 0.99
  n_step: 3
  actor_model: ../models/flashsac_128x2_relu.json
  critic_model: ../models/flashsac_256x2_relu.json
  reward_normalization: true
  target_update_tau: 0.01
  ent_coef: auto_0.01
  sigma_target: 0.15
  actor_update_period: 2
  seed: 0
variants:
  - {algo: FlashSAC, enabled: true}
