category: mjlab
runner: dpg
# Sampling schedule: FlashSAC's GPU-simulator recipe, adapted to local SAC.
# https://github.com/Holiday-Robot/FlashSAC/blob/87edc9061150ae9e962dd84e6544e27a1554b3ab/scripts/run_isaaclab.sh
runtime:
  device: 0
base:
  env: Mjlab-Velocity-Flat-Unitree-Go1
  env_backend: mjlab
  env_device: cuda:0
  env_jax_arrays: true
  env_reuse_for_eval: true
  worker: 1024
  # train_freq counts transitions across all workers: two updates per vector step.
  train_freq: 1024
  gradient_steps: 2
  steps: 50000896
  eval_num: 5
  learning_rate: 0.0003
  buffer_size: 1e7
  batch: 2048
  learning_starts: 100000
  gamma: 0.99
  n_step: 3
  obs_rms_norm: true
  actor_model: ../models/simba_512x2_relu.json
  critic_model: ../models/simba_512x2_relu.json
  reward_normalization: true
  target_update_tau: 0.01
  ent_coef: auto_0.005
  sigma_target: 0.15
  actor_update_period: 2
  optimizer: adam
variants:
  - {algo: TQC, enabled: true}
