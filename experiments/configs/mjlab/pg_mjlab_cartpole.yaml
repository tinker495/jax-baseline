category: mjlab
runner: pg
# PPO settings: mjlab v1.6.0 cartpole_ppo_runner_cfg.
# https://github.com/mujocolab/mjlab/blob/v1.6.0/src/mjlab/tasks/cartpole/cartpole_env_cfg.py
runtime:
  device: 0
base:
  algo: PPO
  env_backend: mjlab
  env_device: cuda:0
  env_jax_arrays: true
  env_reuse_for_eval: true
  worker: 1024
  # Local parallelism choice: 1024 workers * 32 steps * 500 upstream iterations.
  steps: 16384000
  eval_num: 5
  batch: 32
  actor_model: ../models/mlp_64x2_elu.json
  critic_model: ../models/mlp_64x2_elu.json
  mini_batch: 8192
  epoch_num: 5
  learning_rate: 0.001
  desired_kl: 0.01
  gamma: 0.99
  lamda: 0.95
  ppo_eps: 0.2
  value_clip: 0.2
  ent_coef: 0.01
  obs_rms_norm: false
  gae_normalize: true
  gae_normalize_scope: batch
  max_grad_norm: 1.0
  optimizer: adam
  optimizer_eps: 1.0e-8
  seed: 0
variants:
  - {env: Mjlab-Cartpole-Balance, enabled: true}
  - {env: Mjlab-Cartpole-Swingup, enabled: true}
