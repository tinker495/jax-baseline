family: pg
runtime:
  device: 0
base:
  env: Mjlab-Velocity-Flat-Unitree-Go1
  env_backend: mjlab
  env_device: cuda:0
  worker: 4096
  steps: 491520000
  eval_num: 5
  batch: 24
  node: 512
  hidden_n: 3
  mini_batch: 24576
  epoch_num: 5
  learning_rate: 0.001
  gamma: 0.99
  lamda: 0.95
  ppo_eps: 0.2
  value_clip: 0.2
  ent_coef: 0.01
  val_coef: 0.01
  obs_normalization: true
  gae_normalize: true
  gae_normalize_scope: minibatch
  max_grad_norm: 1.0
  optimizer: adam
  optimizer_eps: 1.0e-8
variants:
  - {algo: PPO, enabled: true}
  - {algo: SPO, enabled: true}
