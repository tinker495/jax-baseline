family: pg
runtime:
  device: 0
base:
  env: Mjlab-Velocity-Flat-Unitree-Go1
  env_backend: mjlab
  env_device: cuda:0
  env_jax_arrays: true
  env_reuse_for_eval: true
  worker: 4096
  steps: 983040000
  eval_num: 5
  batch: 24
  actor_model: models/mlp_512x3_relu.json
  critic_model: models/mlp_512x3_relu.json
  mini_batch: 24576
  epoch_num: 5
  learning_rate: 0.001
  gamma: 0.99
  lamda: 0.95
  ppo_eps: 0.2
  value_clip: 0.2
  ent_coef: 0.01
  obs_rms_norm: true
  gae_normalize: true
  gae_normalize_scope: minibatch
  max_grad_norm: 1.0
  optimizer: adam
  optimizer_eps: 1.0e-8
variants:
  - {algo: PPO, enabled: true}
  - {algo: SPO, enabled: true}
